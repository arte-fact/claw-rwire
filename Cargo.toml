[package]
name = "claw-rwire"
version = "0.1.0"
edition = "2024"

[dependencies]
rwire = { path = "../rwire/libs/rwire" }
rwire-components = { path = "../rwire/libs/rwire-components" }
rwire-markdown = { path = "../rwire/libs/rwire-markdown" }
rwire-themes = { path = "../rwire/libs/rwire-themes" }
async-std = { version = "1.12", features = ["attributes"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# Blocking HTTP for the OpenAI-compatible endpoint. The bridge is a sync thread, so
# a blocking pure-Rust client (rustls TLS) fits with no async runtime there.
ureq = { version = "2", features = ["json"] }

# Optional rootless sandbox for agent `bash` execution (R6), behind the `sandbox` feature and
# Linux-only. First-party crate (../isola, we own it).
[target.'cfg(target_os = "linux")'.dependencies]
isola = { path = "../isola", optional = true }

[features]
# Compile in isola-backed command execution. Off by default → `bash` runs on the host (today's
# behaviour); `CLAW_SANDBOX=isola` only takes effect when built with this feature on Linux.
sandbox = ["dep:isola"]

[dev-dependencies]
tempfile = "3"
